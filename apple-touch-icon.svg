<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="180" height="180" rx="39.6" fill="url(#bg)"/>
  <!-- Decorative dots -->
  <circle cx="27" cy="27" r="7.2" fill="#a78bfa" opacity="0.3"/>
  <circle cx="153" cy="36" r="4.5" fill="#818cf8" opacity="0.4"/>
  <circle cx="18" cy="153" r="5.3999999999999995" fill="#c4b5fd" opacity="0.25"/>
  <!-- Fish emoji-style icon -->
  <text x="90" y="93.60000000000001" font-size="68.4" text-anchor="middle" dominant-baseline="middle">🐟</text>
  <!-- "英" character below -->
  <text x="90" y="147.6" font-size="28.8" font-family="-apple-system, sans-serif" font-weight="700" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle">英语打卡</text>
</svg>