<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="50%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#4c1d95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112.64" fill="url(#bg)"/>
  <!-- Decorative dots -->
  <circle cx="76.8" cy="76.8" r="20.48" fill="#a78bfa" opacity="0.3"/>
  <circle cx="435.2" cy="102.4" r="12.8" fill="#818cf8" opacity="0.4"/>
  <circle cx="51.2" cy="435.2" r="15.36" fill="#c4b5fd" opacity="0.25"/>
  <!-- Fish emoji-style icon -->
