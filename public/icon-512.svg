  <!-- "英" character below -->
  <text x="256" y="419.84" font-size="81.92" font-family="-apple-system, sans-serif" font-weight="700" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle">英语打卡</text>
</svg>